<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUFEM Fıkıh Portalı | Sultander</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --sufem-red: #dc2626; --sufem-dark: #1e293b; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: var(--sufem-dark); }
        .sufem-logo-btn {
            background: linear-gradient(145deg, #f8fafc, #e2e8f0);
            border: 1px solid #cbd5e1;
            box-shadow: 4px 4px 8px #e2e8f0, -4px -4px 8px #ffffff;
            padding: 10px 24px; border-radius: 12px; display: inline-block; transition: all 0.3s;
        }
        .verdict-tag { font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; margin-bottom: 12px; display: inline-block; }
        .caiz { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .haram { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .mekruh { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .vacip { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
        .faq-content { max-height: 0; overflow: hidden; transition: all 0.4s ease; opacity: 0; }
        .faq-item.active .faq-content { max-height: 1200px; opacity: 1; padding-bottom: 1.5rem; }
        .faq-item.active { border-color: var(--sufem-red); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1); }
        .pagination-btn { padding: 8px 16px; border-radius: 8px; font-weight: bold; transition: all 0.2s; border: 1px solid #e2e8f0; }
        .pagination-btn.active { background-color: var(--sufem-red); color: white; border-color: var(--sufem-red); }
        .cat-btn.active { background-color: var(--sufem-red); color: white; }
    </style>
</head>
<body class="antialiased">

    <header class="bg-white border-b border-slate-200 py-6 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="cursor-pointer" onclick="window.location.reload()">
                <div class="sufem-logo-btn">
                    <h1 class="text-3xl font-black text-slate-700 tracking-tighter">SUFEM</h1>
                </div>
            </div>
            <div class="text-center md:text-right">
                <h2 class="text-lg font-bold text-slate-800 tracking-tight">Sultander Fıkıh İhtisas Eğitim Merkezi</h2>
                <p class="text-[10px] uppercase tracking-widest font-bold text-slate-400">Fetva ve Fıkhi Araştırmalar Portalı</p>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="bg-white border border-slate-200 p-6 rounded-3xl shadow-sm mb-8">
            <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Fetva içinde ara..." class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none mb-6">
            <div class="flex flex-wrap gap-2">
                <button onclick="setFilter('all')" id="btn-all" class="cat-btn active pagination-btn">Tümü</button>
                <button onclick="setFilter('sular')" id="btn-sular" class="cat-btn pagination-btn">Sular</button>
                <button onclick="setFilter('abdest')" id="btn-abdest" class="cat-btn pagination-btn">Abdest</button>
                <button onclick="setFilter('mesh')" id="btn-mesh" class="cat-btn pagination-btn">Mesh</button>
                <button onclick="setFilter('teyemmüm')" id="btn-teyemmüm" class="cat-btn pagination-btn">Teyemmüm</button>
                <button onclick="setFilter('gusül')" id="btn-gusül" class="cat-btn pagination-btn">Gusül</button>
                <button onclick="setFilter('necaset')" id="btn-necaset" class="cat-btn pagination-btn">Necaset</button>
                <button onclick="setFilter('namaz')" id="btn-namaz" class="cat-btn pagination-btn">Namaz</button>
                <button onclick="setFilter('kurban')" id="btn-kurban" class="cat-btn pagination-btn">Kurban</button>
                <button onclick="setFilter('finans')" id="btn-finans" class="cat-btn pagination-btn">Finans</button>
                <button onclick="setFilter('ibadet')" id="btn-ibadet" class="cat-btn pagination-btn">İbadet & Temizlik</button>
                <button onclick="setFilter('aile')" id="btn-aile" class="cat-btn pagination-btn">Aile & Yaşam</button>
            </div>
        </div>
        <div id="faqContainer" class="grid gap-3"></div>
        <div id="pagination" class="flex justify-center gap-2 mt-8"></div>
    </main>

    <script>
        const allData = [
            // --- MEST, ABDEST VE GUSÜL ---
            { c: 'mesh', s: 'Mest üzerine mesh yapabilmenin temel şartları nelerdir?', v: 'vacip', r: 'Mestlerin abdestli giyilmesi, topukları örtmesi, en az 5 km yola dayanıklı olması ve üzerinde 3 parmak miktarında delik bulunmaması gerekir.' },
            { c: 'mesh', s: 'Mesh süresi ne kadardır ve ne zaman başlar?', v: 'vacip', r: 'Mukim için 24, seferi için 72 saattir. Süre, mest giyildikten sonra ilk abdestin bozulduğu andan itibaren başlar.' },
            { c: 'mesh', s: 'Mestler ayaktan çıkarılırsa abdest bozulur mu?', v: 'caiz', r: 'Kişi abdestli ise sadece ayaklarını yıkaması yeterlidir. Ancak mestin tamamen çıkması veya ayağın büyük kısmının dışarı kayması abdesti bozar.' },
            { c: 'mesh', s: 'Sargı üzerine meshin hükmü nedir?', v: 'caiz', r: 'Sargıyı açmak zarar veriyorsa üzerine bir kez meshedilir. Süre sınırı yoktur, yara iyileşene kadar devam eder. Sargının abdestli sarılması şart değildir.' },
            { c: 'abdest', s: 'Vücuttan çıkan hangi sıvılar abdesti bozar?', v: 'vacip', r: 'Önden ve arkadan çıkan her türlü necaset ve yel çıkması abdesti bozar. Diğer yerlerden çıkan kan ise çıkış yerinden taşarsa bozar.' },
            { c: 'abdest', s: 'Kusmak hangi durumda abdesti bozar?', v: 'vacip', r: 'Ağız dolusu (kolayca yutulamayacak kadar) kusmak abdesti bozar. Daha azı bozmaz.' },
            { c: 'abdest', s: 'Uyku ve gülme abdesti hangi şartlarda bozar?', v: 'vacip', r: 'Makatın yerden kesildiği uyku halleri ve namaz içinde başkasının duyacağı kadar kahkaha ile gülmek abdesti bozar.' },
            { c: 'abdest', s: 'Abdesti bozmayan durumlardan bazıları nelerdir?', v: 'caiz', r: 'Hastalık dışı gözyaşı, vücuttan kopan deri, balgam, tırnak kesmek, tıraş olmak ve başkasının vücuduna dokunmak abdesti bozmaz.' },
            { c: 'gusül', s: 'Gusül abdestini farz kılan durumlar nelerdir?', v: 'vacip', r: 'Şehvetle meninin gelmesi, cinsel ilişki, hayız ve nifas hallerinin sona ermesi guslü farz kılar.' },
            { c: 'gusül', s: 'Guslün farzları nelerdir?', v: 'vacip', r: 'Ağza su vermek, burnuna su vermek ve tüm vücudu iğne ucu kadar kuru yer kalmayacak şekilde yıkamaktır.' },
            { c: 'gusül', s: 'Gusül abdesti alırken nelere dikkat edilmelidir?', v: 'vacip', r: 'Göbek oyuğu, küpe delikleri ve tırnak araları ıslanmalıdır. Diş arasında nohut kadar sert yemek parçası kalmamalıdır.' },
            { c: 'gusül', s: 'Cünüp veya hayızlı bir kimseye haram olan şeyler nelerdir?', v: 'haram', r: 'Namaz kılmak, Kur’an okumak/dokunmak, Kabe’yi tavaf etmek ve mescide girmek haramdır.' },
            { c: 'gusül', s: 'Hangi durumlarda gusül almak müstehap veya sünnettir?', v: 'caiz', r: 'Cuma ve Bayram namazları, ihrama giriş ve mübarek geceler öncesinde gusletmek müstehap/sünnettir.' },
            
            // --- NAMAZ (21 SORU) ---
            { c: 'namaz', s: 'İslam\'da Allah’a imandan sonra gelen en önemli farz nedir?', v: 'vacip', r: 'Namazdır; namaz imanın işareti, kalbin ışığı ve müminin miracıdır.' },
            { c: 'namaz', s: 'Beş vakit namaz ne zaman ve hangi olayla farz kılınmıştır?', v: 'vacip', r: 'Hicretten yaklaşık 18 ay önce Miraç gecesinde farz kılınmıştır.' },
            { c: 'namaz', s: 'Namazın din içindeki yerini belirten hadis-i şerif nedir?', v: 'vacip', r: 'Hadis-i şerifte namazın "dinin direği" olduğu bildirilmiştir.' },
            { c: 'namaz', s: 'Kur\'an-ı Kerim\'e göre namazın insan üzerindeki ahlaki etkisi nedir?', v: 'caiz', r: 'Ankebut 45. ayete göre namaz, kişiyi edep ve namusa uygun olmayan çirkin işlerden alıkoyar.' },
            { c: 'namaz', s: 'Bir kimseye namazın farz olması için hangi şartlar gerekir?', v: 'vacip', r: 'Müslüman olmak, akıllı olmak ve ergenlik (buluğ) çağına ulaşmış olmak gerekir.' },
            { c: 'namaz', s: 'Kadınların özel hallerinde namaz yükümlülüğü nasıldır?', v: 'caiz', r: 'Hayız ve lohusalık hallerinde namaz farz değildir ve kaza edilmesi de gerekmez.' },
            { c: 'namaz', s: 'Hüküm bakımından namazlar kaça ayrılır?', v: 'vacip', r: 'Farz, vacip, sünnet ve nafile olmak üzere dört kısma ayrılır.' },
            { c: 'namaz', s: 'Beş vakit farz namazın rekat sayıları nelerdir?', v: 'vacip', r: 'Sabah 2, öğle 4, ikindi 4, akşam 3 ve yatsı 4 rekat (farzlar) olarak kılınır.' },
            { c: 'namaz', s: 'Hangi namazlar "Vacip" kategorisindedir?', v: 'vacip', r: 'Vitir namazı ile Ramazan ve Kurban Bayramı namazları vaciptir.' },
            { c: 'namaz', s: 'Teravih namazının hükmü nedir ve kaç rekattır?', v: 'caiz', r: 'Müekked bir sünnettir ve 20 rekat olarak kılınır.' },
            { c: 'namaz', s: 'Namazın dışındaki farzlar (şartlar) nelerdir?', v: 'vacip', r: 'Hadesten taharet, Necasetten taharet, Setr-i avret, İstikbal-i Kıble, Vakit ve Niyet.' },
            { c: 'namaz', s: 'Namazın içindeki farzlar (rükünler) nelerdir?', v: 'vacip', r: 'İftitah tekbiri, Kıyam, Kıraat, Rükû, Secde ve Kade-i Ahire (Son oturuş).' },
            { c: 'namaz', s: 'Tadil-i Erkan ve Huruç bisun\'ihi neyi ifade eder?', v: 'vacip', r: 'Tadil-i erkan rükünleri yerli yerince yapmaktır. Huruç bisun\'ihi ise namazdan kendi isteğiyle çıkmaktır.' },
            { c: 'namaz', s: 'Cuma namazının farz olması için gereken kişisel şartlar nelerdir?', v: 'vacip', r: 'Erkek olmak, mukim olmak, sağlıklı olmak ve yürüyebilecek durumda olmak gerekir.' },
            { c: 'namaz', s: 'Cenaze namazının hükmü ve temel farkı nedir?', v: 'vacip', r: 'Farz-ı kifâyedir. Rükû ve secdesi yoktur, ayakta 4 tekbirle kılınır.' },
            { c: 'namaz', s: 'Bayram namazları bir özür nedeniyle ilk gün kılınamazsa ne yapılır?', v: 'caiz', r: 'Ramazan bayramı 2. gün, Kurban bayramı 3. gün istiva vaktine kadar kılınabilir.' },// Hata buradaydı: Virgül eklendi.

            // --- TEYEMMÜM (12 SORU) ---
            { c: 'teyemmüm', s: 'Teyemmümün sözlük ve dini terim anlamı nedir, nasıl yapılır?', v: 'vacip', r: 'Sözlükte "kastetmek" demektir. Su bulunmadığında niyet edilerek, ellerin toprağa vurulup yüz ve kolların meshedilmesiyle yapılır.' },
            { c: 'teyemmüm', s: 'Teyemmümün farzları nelerdir?', v: 'vacip', r: 'Üç farzı vardır: Niyet etmek, elleri toprağa vurup yüzü meshetmek, tekrar vurup kolları meshetmek.' },
            { c: 'teyemmüm', s: 'Teyemmümün sünnete uygun yapılış adımları nelerdir?', v: 'caiz', r: 'Besmele ile başlamak, parmakları açık tutmak, tozları silkelemek ve sıraya uymak sünnettir.' },
            { c: 'ibadet', s: 'Suyun "gerçekten" veya "hükmen" bulunmaması ne demektir?', v: 'vacip', r: 'Suyun 1 mil (1.6 km) uzakta olması gerçekten yokluktur; su varken hastalık riski nedeniyle kullanılamaması ise hükmen yokluktur.' },
            { c: 'teyemmüm', s: 'Hangi acil durumlarda su varken teyemmüm edilebilir?', v: 'caiz', r: 'Cenaze veya Bayram namazının tamamen kaçırılacağı korkusu varsa teyemmüm edilebilir. Vakit namazları için teyemmüm edilmez, kaza edilir.' },
            { c: 'teyemmüm', s: 'Yolculukta su arama sınırı nedir?', v: 'vacip', r: 'Güvenli ise 300-400 adım su aranmalıdır. Su normal fiyatının çok üzerindeyse (fahiş fiyat) satın alma zorunluluğu yoktur.' },
            { c: 'teyemmüm', s: 'Teyemmümde niyetin sınırı nedir? Her niyetle namaz kılınabilir mi?', v: 'vacip', r: 'Namaz kılmaya niyet şarttır. Sadece Kur\'an tutmak veya kabir ziyareti için alınan teyemmümle namaz kılınmaz.' },
            { c: 'teyemmüm', s: 'Teyemmüm hangi maddelerle yapılır, hangileriyle yapılmaz?', v: 'caiz', r: 'Toprak, kum, mermer, kiremit gibi toprak cinsinden maddelerle yapılır. Cam, demir, kumaş gibi maddelerle (toz yoksa) yapılamaz.' },
            { c: 'gusül', s: 'Vücudunda yara olan bir kimse nasıl abdest/gusül alır?', v: 'vacip', r: 'Vücudun yarısı veya fazlası yaralıysa teyemmüm edilir. Yaralı kısım az ise sağlam yerler yıkanır, yara üzerine mesh edilir.' },
            { c: 'teyemmüm', s: 'Teyemmümü bozan durumlar nelerdir?', v: 'vacip', r: 'Abdesti bozan her şey ve suyun bulunması veya hastalığın geçmesi gibi teyemmüm mazeretinin ortadan kalkması teyemmümü bozar.' },
            { c: 'teyemmüm', s: 'Namaz kılarken su görülürse ne olur?', v: 'vacip', r: 'Namaz esnasında su görülürse namaz bozulur. Ancak namaz bittikten sonra su bulunursa namazın iadesi gerekmez.' },
            { c: 'teyemmüm', s: 'Bir teyemmümle birden fazla namaz kılınabilir mi?', v: 'caiz', r: 'Evet, yeni bir abdestsizlik hali oluşmadığı veya su bulunmadığı sürece dilediğiniz kadar farz ve nafile kılınabilir.' },

            // --- ÖZÜR VE ABDEST ESASLARI (9 SORU) ---
            { c: 'abdest', s: 'İslam fıkhına göre "özür" ne demektir?', v: 'vacip', r: 'Abdesti bozup devam eden her türlü illete denir. İlletin tam bir namaz vakti boyunca kesilmemesi şarttır.' },
            { c: 'abdest', s: 'Özürlü bir kimsenin abdesti ne zaman bozulur?', v: 'vacip', r: 'Namaz vaktinin girmesiyle değil, vaktin çıkmasıyla bozulur. Özür dışı bir sebeple bozulursa yeniden alınmalıdır.' },
            { c: 'necaset', s: 'Özürlü kimsenin çamaşırına bulaşan necaset namaza engel midir?', v: 'caiz', r: 'Özür devam ettiği müddetçe, sızıntı el ayasını aşsa bile namazın sıhhatine engel olmaz.' },
            { c: 'abdest', s: 'Abdestin farzları nelerdir?', v: 'vacip', r: 'Yüzü, elleri dirseklerle, ayakları topuklarla yıkamak ve başın dörtte birini meshetmektir.' },
            { c: 'abdest', s: 'Abdestte niyetin ve sıranın hükmü nedir?', v: 'caiz', r: 'Niyet etmek ve organları sırasıyla yıkamak sünnettir; bu sıraya uyulmaması abdesti bozmaz.' },
            { c: 'mesh', s: '"Kaplama Mesh" nedir?', v: 'caiz', r: 'Başın tamamının tek bir suyla meshedilmesidir. Sünnete uygun bir temizlik şeklidir.' },
            { c: 'abdest', s: 'Abdestin edepleri (müstehapları) nelerdir?', v: 'caiz', r: 'Vakit girmeden hazır bulunmak, kıbleye yönelmek ve abdest sonunda şehadet getirmek.' },
            { c: 'abdest', s: 'Vücuttaki hangi lekeler abdeste engel değildir?', v: 'caiz', r: 'Tırnak kiri, sinek tersi engel değildir. Ancak su geçirmeyen boya, hamur, mum abdeste manidir.' },
            { c: 'abdest', s: 'Abdest alıp almadığında şüpheye düşen ne yapmalıdır?', v: 'caiz', r: 'Abdestli olduğunu kesin bilip bozulduğunda şüphe eden kişi abdestli sayılır.' },

            // --- SULAR VE NECASET (15 SORU) ---
            { c: 'sular', s: 'Sular temel olarak kaça ayrılır?', v: 'caiz', r: 'Mutlak ve mukayyed sular. Mutlak sularla abdest alınır, mukayyedlerle (gül suyu vb.) alınmaz.' },
            { c: 'sular', s: '"Ma-i Müstamel" (kullanılmış su) nedir?', v: 'haram', r: 'İbadet maksadıyla kullanılan sudur. Maddi kiri temizler ama hükmi temizlikte tekrar kullanılmaz.' },
            { c: 'sular', s: 'Büyük havuz ölçüsü nedir?', v: 'caiz', r: 'Yaklaşık 46 metrekarelik durgun sular büyük havuzdur. Vasıfları bozulmadıkça temizdir.' },
            { c: 'sular', s: 'Akarsuların temizlik hükmü nedir?', v: 'caiz', r: 'Büyük havuz hükmündedir. Bir saman çöpünü sürükleyebiliyorsa akıcı sayılır.' },
            { c: 'sular', s: 'Şüpheli su (eşek artığı) durumunda ne yapılır?', v: 'vacip', r: 'Başka su yoksa abdest alınır, üzerine teyemmüm yapılır.' },
            { c: 'sular', s: 'Hangi hayvanların artığı temizdir?', v: 'caiz', r: 'İnsan, deve, sığır, koyun ve eti yenen vahşi hayvanların artıkları temizdir.' },
            { c: 'sular', s: 'Hangi hayvanların artığı necis sayılır?', v: 'haram', r: 'Köpek, domuz ve yırtıcı hayvanların artıkları necis sayılır.' },
            { c: 'sular', s: 'Hayvanların teri ve salyası neye tabidir?', v: 'caiz', r: 'Hayvanın artığı (içtiği su) temizse teri de temizdir, necis ise teri de necistir.' },
            { c: 'necaset', s: 'Ağır necaset (galize) ile hafif necaset farkı nedir?', v: 'vacip', r: 'Ağırda sınır 4,5g/el ayasıdır. Hafifte bulaştığı organın 1/4’üdür.' },
            { c: 'sular', s: 'Suda ölen hayvanlar suyu pisletir mi?', v: 'caiz', r: 'Suda yaşayan balık vb. hayvanlar suyu pisletmez.' },
            { c: 'necaset', s: 'Görülmeyen pislik bulaşmış eşya nasıl temizlenir?', v: 'vacip', r: 'Üç kez yıkanıp her defasında iyice sıkılırsa temizlenir.' },
            { c: 'necaset', s: 'Ateşe sokarak temizleme geçerli mi?', v: 'caiz', r: 'Fırın ve tandırlar iyice ısıtıldığında temiz sayılır.' },
            { c: 'necaset', s: 'İstihâle (kimyevi değişim) nedir?', v: 'caiz', r: 'Maddenin yapısının değişmesidir (Şarabın sirkeye dönmesi gibi).' },
            { c: 'necaset', s: 'Derilerin temizlenmesi nasıl olur?', v: 'caiz', r: 'Domuz dışındaki deriler tabaklanmakla temiz olur. İnsan derisi kullanılamaz.' },
            { c: 'abdest', s: 'İstinca ve istibra farkı nedir?', v: 'vacip', r: 'İstinca taharettir, istibra idrar sızıntısını tam kesmek için beklemektir.' },

            // --- NAMAZIN ŞARTLARI: TAHARET, SETR-İ AVRET, KIBLE VE VAKİT (17 SORU) ---
            { c: 'necaset', s: 'Necaset-i Galiza (ağır pislik) nedir ve namaza engel olma sınırı ne kadardır?', v: 'vacip', r: 'Kan, irin, idrar, şarap ve köpek salyası gibi maddelerdir. Avuç içi kadar bir alanı kaplarsa namaz geçersiz olur.' },
            { c: 'necaset', s: 'Necaset-i Hafife (hafif pislik) örnekleri nelerdir ve hangi miktarı namazı bozar?', v: 'vacip', r: 'Eti yenen hayvanların idrarı ve kuş pislikleri bu gruba girer. Bulaştığı uzvun dörtte birini kaplarsa namaz bozulur.' },
            { c: 'necaset', s: 'Namaz esnasında elbiseye pislik sıçrarsa ne yapılmalıdır?', v: 'caiz', r: 'Hemen temizlenirse namaz bozulmaz; ancak temizleme işlemi namazın rükünlerini yerine getirecek kadar uzun sürerse namaz bozulur.' },

                    <div class="faq-content px-6">
                        <div class="verdict-tag ${item.v}">${item.v}</div>
                        <p class="text-slate-600 text-sm leading-relaxed">${item.r}</p>
                    </div>
                </div>
            `).join('');
            renderPagination();
        }

        function renderPagination() {
            const nav = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredData.length / perPage);
            nav.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
                btn.onclick = () => { currentPage = i; renderFAQ(); window.scrollTo(0,0); };
                nav.appendChild(btn);
            }
        }

        function handleSearch(val) {
            const q = val.toLowerCase().trim();
            filteredData = allData.filter(d => d.s.toLowerCase().includes(q) || d.r.toLowerCase().includes(q));
            currentPage = 1;
            renderFAQ();
        }

        function setFilter(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + cat).classList.add('active');
            filteredData = cat === 'all' ? [...allData] : allData.filter(d => d.c === cat);
            currentPage = 1;
            renderFAQ();
        }

        function toggleFaq(btn) {
            const item = btn.closest('.faq-item');
            const wasActive = item.classList.contains('active');
            document.querySelectorAll('.faq-item').forEach(f => f.classList.remove('active'));
            if (!wasActive) item.classList.add('active');
        }

        renderFAQ();
    </script>
</body>
</html>
